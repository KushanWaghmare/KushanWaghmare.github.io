[build]
  publish = "public"
  command = "npm run build:netlify"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Netlify Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Development settings
[dev]
  command = "npm run dev:netlify"
  port = 3000
  publish = "public"
  functions = "netlify/functions"

# Redirects and rewrites
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/socket.io/*"
  to = "/.netlify/functions/socket"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss:;"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Environment-specific settings
[context.production]
  command = "npm run build:netlify && npm run generate:functions"

[context.production.environment]
  NODE_ENV = "production"
  NETLIFY_FUNCTIONS = "true"

[context.deploy-preview]
  command = "npm run build:netlify"

[context.branch-deploy]
  command = "npm run build:netlify"

# Form handling for contact form
[plugins]
  [[plugins.package]]
    package = "@netlify/plugin-functions-install-core"

# Edge functions (for advanced features)
[[edge_functions]]
  function = "visitor-tracker"
  path = "/api/stats"

[[edge_functions]]
  function = "theme-sync"
  path = "/api/theme"

# Split testing (optional)
[[split_tests]]
  id = "portfolio-version"
  [[split_tests.branches]]
    weight = 50
    name = "original"
  [[split_tests.branches]]
    weight = 50
    name = "variant"
