<!DOCTYPE html>
<html lang="en-GB" data-domain="math" data-theme="dark">
<head>
    <meta charset="utf-8">
    <title>Calabi–Yau cross-section: test harness (dev only)</title>
    <link rel="stylesheet" href="../shared/style.css">
    <style>
        html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #host { position: relative; width: 100vw; height: 100vh; }
        #host canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
        .sim-tag { position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 10; color: #ddd; font: 12px monospace; pointer-events: none; }
    </style>
</head>
<body>
    <div id="host" class="snap-section"><canvas id="c"></canvas><div class="sim-tag"></div></div>
    <script>
        /* Minimal copies of the KW helpers (same semantics as shared/app.js) so the scene can be tested without the site shell. */
        const q = new URLSearchParams(location.search);
        const rgb = getComputedStyle(document.documentElement).getPropertyValue("--a").trim().split(",").map(Number);
        const KW = (window.KW = { REDUCED: q.has("reduced"), mouse: { cx: -1e4, cy: -1e4 }, col: { a: rgb, light: false } });
        window.__errors = [];
        addEventListener("error", (e) => window.__errors.push(String(e.message)));
        const oc = console.error; console.error = (...a) => { window.__errors.push(a.join(" ")); oc(...a); };
        addEventListener("pointermove", (e) => { KW.mouse.cx = e.clientX; KW.mouse.cy = e.clientY; });
        KW.local = (c) => { const r = c.getBoundingClientRect(); return { x: KW.mouse.cx - r.left, y: KW.mouse.cy - r.top }; };
        KW.tag = (t) => { const el = document.querySelector(".sim-tag"); if (el && el.textContent !== t) el.textContent = t; };
        KW.onClick = (c, fn) => {
            const h = (e) => fn(e); addEventListener("click", h);
            const o = c.__dispose; c.__dispose = () => { removeEventListener("click", h); if (o) o(); };
        };
        KW.fit = (c, cb) => {
            const p = c.parentElement, f = () => {
                const dpr = Math.min(devicePixelRatio || 1, 2), w = p.clientWidth || 300, h = Math.max(p.clientHeight || 150, 1);
                c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); cb(w, h, dpr);
            };
            f(); const ro = new ResizeObserver(f); ro.observe(p);
            const o = c.__dispose; c.__dispose = () => { ro.disconnect(); if (o) o(); };
        };
        KW.loop = (c, step) => {
            let last = performance.now(), dead = false;
            const o = c.__dispose; c.__dispose = () => { dead = true; if (o) o(); };
            const tick = (now) => { if (dead) return; const dt = Math.min((now - last) / 1000, 0.033); last = now; step(now / 1000, dt); requestAnimationFrame(tick); };
            requestAnimationFrame(tick);
        };
    </script>
    <script src="../shared/gfx.js"></script>
    <script src="../shared/lib/cy-math.js"></script>
    <script src="../shared/gpu/gpu-cy-shaders.js"></script>
    <script src="../shared/gpu/gpu-cy-oit.js"></script>
    <script src="../shared/gpu/gpu-cy.js"></script>
    <script>
        const params = {}; if (q.has("tier")) params.tier = +q.get("tier"); if (q.has("n")) params.n = +q.get("n");
        window.__sim = SIMS["cy-cross-section"](document.getElementById("c"), params);
    </script>
</body>
</html>
